name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the app project
        run: |
          mkdir -p project
          echo "" | base64 -d | tar xzf - -C project
          find project -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk DCA-Tracker.apk

      - name: Keep the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: DCA-Tracker
          path: DCA-Tracker.apk

      - name: Publish to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DCA Tracker build ${{ github.run_number }}
          files: DCA-Tracker.apk
