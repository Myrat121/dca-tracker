<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCA Ladder Tracker</title>
<style>
:root{
  --bg:#0d1117; --panel:#151b23; --line:#263040; --fg:#e8edf3; --muted:#8b96a5;
  --accent:#7b9cff; --buy:#3ccf91; --sell:#f0a93b; --loss:#ff6b6b;
  --buy-soft:#123326; --loss-soft:#3a1a1c; --accent-soft:#1b2540;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:8px}
h1{font-size:1.5rem;margin:0}
.muted{color:var(--muted);font-size:.85rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#coins{display:grid;gap:18px}
.tks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tk{padding:14px 16px;display:grid;gap:4px;border-right:1px solid var(--line)}
.tk:last-child{border-right:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:16px}
.sym{font-weight:700;font-size:1.2rem;margin-right:8px}
.px{font-family:var(--mono);font-size:1.5rem;font-weight:700}
.next{display:grid;gap:3px;text-align:right;font-size:.85rem;color:var(--muted)}
.next b{color:var(--fg);font-family:var(--mono)}
.pill{display:inline-block;font-family:var(--mono);font-size:.75rem;padding:2px 8px;border-radius:99px}
.acc{background:var(--accent-soft);color:var(--accent)} .gr{background:var(--buy-soft);color:var(--buy)} .rd{background:var(--loss-soft);color:var(--loss)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:10px 16px;display:grid;gap:2px;border-right:1px solid var(--line)}
.lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.pos{color:var(--buy)} .neg{color:var(--loss)} .tgt{color:var(--sell)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.85rem}
th{font:600 .68rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;padding:10px 12px}
th:first-child,td:first-child{text-align:left}
td{padding:9px 12px;text-align:right;border-top:1px solid var(--line)}
tr.filled td{background:var(--buy-soft)}
tr.nx td:first-child{border-left:3px solid var(--accent)}
tr.mk td{padding:0;border:0}
.now{display:flex;align-items:center;gap:8px;padding:3px 12px;color:var(--accent);font-size:.75rem;font-weight:700}
.now::before,.now::after{content:"";flex:1;border-top:2px dashed var(--accent)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--buy);cursor:pointer;vertical-align:middle;margin-right:6px}
.settings{padding:16px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row input[type=text]{flex:1;min-width:220px;font-family:var(--mono);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:600 .82rem system-ui,sans-serif;padding:7px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#0d1117;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button.sm{padding:3px 10px;font-size:.75rem;margin-left:10px;vertical-align:middle}
button:disabled{opacity:.4;cursor:default}
input.num{width:120px;font-family:var(--mono);text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input.num:focus{outline:2px solid var(--accent);outline-offset:1px}
#log{font-family:var(--mono);font-size:.78rem;color:var(--muted);max-height:140px;overflow:auto;padding:0 16px 14px;margin:0;white-space:pre-wrap}
#banner{display:none;padding:12px 16px;border-radius:10px;background:var(--sell);color:#111;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>DCA Ladder Tracker</h1>
    <div class="muted" id="subline">Live prices every 30 seconds · keep this tab open to get alerts</div></div>
    <div class="muted" id="status">Connecting…</div>
  </header>
  <div id="banner"></div>
  <div id="coins"></div>

  <section class="card">
    <div class="settings">
      <div class="lbl">Price source</div>
      <div class="row">
        <select id="src" class="num" style="width:auto;text-align:left">
          <option value="bybit">Bybit perpetual (BTCUSDT / ETHUSDT)</option>
          <option value="spot">Spot (CoinGecko, Binance backup)</option>
        </select>
        <select id="ptype" class="num" style="width:auto;text-align:left">
          <option value="last">Last traded price</option>
          <option value="mark">Mark price</option>
        </select>
      </div>
      <div class="lbl">Alerts</div>
      <div class="row">
        <button id="notif">Turn on desktop notifications</button>
        <button class="ghost" id="test">Send test alert</button>
        <span class="muted" id="notifState"></span>
      </div>
      <div class="row">
        <label class="muted" for="nearPct">Warn me when price is within</label>
        <input class="num" style="width:70px" id="nearPct" inputmode="decimal">
        <span class="muted">% of the next buy level or sell target (0 = off)</span>
        <button class="ghost" id="nearSave">Save</button>
      </div>
      <div class="muted">Optional: also send alerts to Telegram (your bot token and chat id are saved only in this browser).</div>
      <div class="row">
        <input type="text" id="tgToken" placeholder="Telegram bot token, e.g. 7412345678:AAH3x...">
        <input type="text" id="tgChat" placeholder="Chat id, e.g. 123456789">
        <button id="tgSave">Save</button>
      </div>
    </div>
    <div class="lbl" style="padding:0 16px 6px">Alert log</div>
    <pre id="log"></pre>
  </section>
</div>

<script>
/* ===== Your plan (edit here if your ladder changes) ===== */
const PLAN = {
  BTC:{name:"Bitcoin", gecko:"bitcoin", binance:"BTCUSDT", dec:6,
       steps:[[83900,67],[77188,81],[71013,97],[65332,117],[60105,140],[55297,168]]},
  ETH:{name:"Ethereum",gecko:"ethereum",binance:"ETHUSDT", dec:4,
       steps:[[2618,30],[2409,36],[2216,44],[2039,52],[1876,63],[1725,75]]}
};
const DEFAULT_STEPS = {BTC:PLAN.BTC.steps.map(s=>[...s]), ETH:PLAN.ETH.steps.map(s=>[...s])};
const REFRESH_MS = 30000;    // price check every 30 s

/* ===== Saved state (in this browser) ===== */
const APP=window.Android||null;   // present when running inside the Android app
const load=(k,d)=>{try{const v=APP?APP.get(k):localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const save=(k,v)=>{try{const s=JSON.stringify(v);APP?APP.set(k,s):localStorage.setItem(k,s)}catch{}};
// Network helper: native in the app (no browser limits), fetch on desktop
function getJSON(url){
  if(APP) return new Promise((res,rej)=>setTimeout(()=>{const t=APP.httpGet(url);if(!t)return rej(new Error("net"));try{res(JSON.parse(t))}catch(e){rej(e)}},0));
  return fetch(url).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
}
function postJSON(url,obj){
  if(APP) return new Promise(res=>setTimeout(()=>{const t=APP.httpPost(url,JSON.stringify(obj));try{res(JSON.parse(t))}catch{res({ok:false,description:"no response"})}},0));
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)}).then(r=>r.json());
}
const savedSteps = load("dca_steps",null);
if(savedSteps) for(const s in PLAN) if(Array.isArray(savedSteps[s])&&savedSteps[s].length) PLAN[s].steps=savedSteps[s];
let ROI = load("dca_roi",0.04);   // sell target over average entry
let fills = load("dca_fills",{BTC:[true,false,false,false,false,false],ETH:[true,true,false,false,false,false]});
for(const s in PLAN){fills[s]=(fills[s]||[]).slice(0,PLAN[s].steps.length);while(fills[s].length<PLAN[s].steps.length)fills[s].push(false)}
let editing = {}; // sym -> draft steps while editing
let alerted = load("dca_alerted",{BTC:"",ETH:""});
let tg = load("dca_tg",{token:"",chat:""});
let source = load("dca_source","bybit");     // "bybit" or "spot"
let priceType = load("dca_pricetype","last"); // Bybit "last" or "mark"
let nearPct = load("dca_nearpct",1);       // warn when within this % of a level
let nearAlerted = load("dca_near",{});
let prices = {BTC:null,ETH:null}, lastUpdate=null;

const usd=(n,d)=>"$"+n.toLocaleString("en-US",{minimumFractionDigits:d??(n<100?2:0),maximumFractionDigits:d??(n<100?2:0)});
const pct=n=>(n>=0?"+":"")+(n*100).toFixed(1)+"%";

function calc(sym){
  const p=PLAN[sym], px=prices[sym], f=fills[sym];
  let inv=0,qty=0,ci=0,cq=0;
  const rows=p.steps.map(([price,amt],i)=>{
    ci+=amt; cq+=amt/price;
    if(f[i]){inv+=amt;qty+=amt/price}
    return {i,price,amt,cumInv:ci,avgIf:ci/cq,profitIf:ci*ROI,drop:price/p.steps[0][0]-1,dist:px?price/px-1:null,filled:!!f[i]};
  });
  const avg=qty?inv/qty:null;
  return {rows,inv,qty,avg,target:avg?avg*(1+ROI):null,next:rows.find(r=>!r.filled),px,
          value:px?qty*px:0, pl:px?qty*px-inv:0};
}

function render(){
  const host=document.getElementById("coins"); host.innerHTML="";
  // Portfolio total across coins
  let tInv=0,tVal=0,tPlan=0,tTgt=0;
  for(const s in PLAN){const c=calc(s);tInv+=c.inv;tVal+=c.value;tTgt+=c.inv*ROI;tPlan+=PLAN[s].steps.reduce((a,x)=>a+x[1],0)}
  const tPl=tVal-tInv, haveAll=Object.values(prices).every(Boolean);
  const tot=document.createElement("section"); tot.className="card";
  const tickers=Object.keys(PLAN).map(s=>{const c=calc(s);return `
    <div class="tk">
      <div><span class="sym">${s}</span><span class="px">${c.px?usd(c.px):"…"}</span></div>
      <div class="muted">${c.next?`Next buy: step ${c.next.i+1} at <b class="mono" style="color:var(--fg)">${usd(c.next.price)}</b> (${usd(c.next.amt)}) ${c.px?`<span class="pill acc">${pct(c.next.price/c.px-1)}</span>`:""}`:"All steps filled"}</div>
    </div>`}).join("");
  tot.innerHTML=`<div class="tks">${tickers}</div><div class="stats" style="border:0;border-top:1px solid var(--line)">
    <div class="stat"><span class="lbl">Total invested</span><span class="val">${usd(tInv,2)}</span></div>
    <div class="stat"><span class="lbl">Total plan budget</span><span class="val">${usd(tPlan)} <span class="muted">${tPlan?Math.round(tInv/tPlan*100)+"% used":""}</span></span></div>
    <div class="stat"><span class="lbl">Remaining to invest</span><span class="val">${usd(tPlan-tInv,2)}</span></div>
    <div class="stat"><span class="lbl">Portfolio value</span><span class="val">${haveAll?usd(tVal,2):"…"}</span></div>
    <div class="stat"><span class="lbl">Total P / L</span><span class="val ${tPl>=0?"pos":"neg"}">${haveAll?(tPl>=0?"+":"−")+usd(Math.abs(tPl),2)+` <span class="muted">${tInv?pct(tPl/tInv):""}</span>`:"…"}</span></div>
    <div class="stat"><span class="lbl">Total target profit</span><span class="val tgt">+${usd(tTgt,2)}</span></div>
  </div>`;
  host.appendChild(tot);
  for(const sym of Object.keys(PLAN)){
    if(editing[sym]){host.appendChild(editCard(sym));continue}
    const p=PLAN[sym], c=calc(sym), px=c.px;
    let rows="", mk=false;
    c.rows.forEach(r=>{
      if(px&&!mk&&px>r.price){rows+=nowRow(px);mk=true}
      rows+=`<tr class="${r.filled?"filled":""} ${c.next&&c.next.i===r.i?"nx":""}">
        <td><label><input type="checkbox" data-s="${sym}" data-i="${r.i}" ${r.filled?"checked":""}>${r.i+1}</label></td>
        <td>${usd(r.price)}</td><td>${usd(r.amt)}</td><td>${usd(r.cumInv)}</td><td>${(r.amt/r.price).toFixed(p.dec)}</td>
        <td>${usd(r.avgIf)}</td><td class="pos">+${usd(r.profitIf,2)}</td><td><span class="pill rd">${(r.drop*100).toFixed(1)}%</span></td>
        <td class="muted">${r.filled?"filled":(r.dist==null?"–":pct(r.dist))}</td></tr>`;
    });
    if(px&&!mk) rows+=nowRow(px);
    const el=document.createElement("section"); el.className="card";
    el.innerHTML=`
      <div class="head">
        <div><span class="sym">${sym}</span><span class="px">${px?usd(px):"…"}</span> <span class="muted">${p.name}</span>
          <button class="ghost sm" data-act="edit" data-s="${sym}">Edit ladder</button></div>
        <div class="next">
          ${c.next?`<span>Next buy: step ${c.next.i+1} at <b>${usd(c.next.price)}</b> ${px?`<span class="pill acc">${pct(c.next.price/px-1)}</span>`:""}</span>`:"<span><b>All steps filled</b></span>"}
          ${c.target?`<span>Sell target: <b class="tgt">${usd(c.target)}</b> <span class="pos">(+${usd(c.inv*ROI,2)})</span> ${px?`<span class="pill gr">${pct(c.target/px-1)} away</span>`:""}</span>`:""}
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span class="lbl">Invested</span><span class="val">${usd(c.inv)} <span class="muted">of ${usd(p.steps.reduce((s,x)=>s+x[1],0))}</span></span></div>
        <div class="stat"><span class="lbl">Avg entry</span><span class="val">${c.avg?usd(c.avg):"–"}</span></div>
        <div class="stat"><span class="lbl">Holdings</span><span class="val">${c.qty.toFixed(p.dec)} ${sym}</span></div>
        <div class="stat"><span class="lbl">Value</span><span class="val">${usd(c.value,2)}</span></div>
        <div class="stat"><span class="lbl">Target profit (+${+(ROI*100).toFixed(2)}%)</span><span class="val tgt">${c.inv?"+"+usd(c.inv*ROI,2):"–"}</span></div>
        <div class="stat"><span class="lbl">P / L</span><span class="val ${c.pl>=0?"pos":"neg"}">${c.pl>=0?"+":"−"}${usd(Math.abs(c.pl),2)} <span class="muted">${c.inv?pct(c.pl/c.inv):""}</span></span></div>
      </div>
      <div class="tbl"><table>
        <thead><tr><th>Step</th><th>Buy price</th><th>Amount</th><th>Total invested</th><th>${sym}</th><th>Avg if filled</th><th>Profit at target</th><th>Drop</th><th>From price</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    host.appendChild(el);
  }
}
function editCard(sym){
  const d=editing[sym], el=document.createElement("section"); el.className="card";
  let tot=0, rows=d.map(([pr,am],i)=>{tot+=+am||0;return `<tr>
    <td>${i+1}</td>
    <td><input class="num" id="e-${sym}-${i}-p" data-s="${sym}" data-i="${i}" data-f="0" value="${pr}" inputmode="decimal"></td>
    <td><input class="num" id="e-${sym}-${i}-a" data-s="${sym}" data-i="${i}" data-f="1" value="${am}" inputmode="decimal"></td>
    <td class="muted">${+pr&&+d[0][0]?((pr/d[0][0]-1)*100).toFixed(1)+"%":"–"}</td>
    <td><button class="ghost sm" data-act="del" data-s="${sym}" data-i="${i}" ${d.length<2?"disabled":""}>Remove</button></td></tr>`}).join("");
  el.innerHTML=`
    <div class="head"><div><span class="sym">${sym}</span><span class="muted">Editing ladder · total ${usd(tot)}</span></div>
      <div class="row">
        <label class="muted" for="roi-${sym}">Sell target</label>
        <input class="num" style="width:70px" id="roi-${sym}" value="${+(ROI*100).toFixed(2)}" inputmode="decimal"><span class="muted">% over avg (all coins)</span>
      </div></div>
    <div class="tbl"><table>
      <thead><tr><th>Step</th><th>Buy price ($)</th><th>Amount ($)</th><th>Drop</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="settings"><div class="row">
      <button class="ghost" data-act="add" data-s="${sym}">+ Add step</button>
      <button class="ghost" data-act="reset" data-s="${sym}">Reset to original plan</button>
      <span style="flex:1"></span>
      <button class="ghost" data-act="cancel" data-s="${sym}">Cancel</button>
      <button data-act="save" data-s="${sym}">Save ladder</button>
    </div><div class="muted" id="err-${sym}"></div></div>`;
  return el;
}
document.addEventListener("input",e=>{
  const t=e.target; if(t.dataset.f===undefined) return;
  editing[t.dataset.s][+t.dataset.i][+t.dataset.f]=t.value;
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]"); if(!b) return;
  const sym=b.dataset.s, act=b.dataset.act;
  if(act==="edit"){editing[sym]=PLAN[sym].steps.map(s=>[...s]);render();return}
  const d=editing[sym];
  if(act==="add"){const last=d[d.length-1]||[0,0];d.push([Math.round((+last[0]||0)*0.94),Math.round((+last[1]||0)*1.2)])}
  if(act==="del"){d.splice(+b.dataset.i,1)}
  if(act==="reset"){editing[sym]=DEFAULT_STEPS[sym].map(s=>[...s])}
  if(act==="cancel"){delete editing[sym]}
  if(act==="save"){
    const steps=d.map(([p,a])=>[parseFloat(String(p).replace(/[,$\s]/g,"")),parseFloat(String(a).replace(/[,$\s]/g,""))]);
    const roi=parseFloat(document.getElementById("roi-"+sym).value);
    const err=document.getElementById("err-"+sym);
    if(steps.some(([p,a])=>!(p>0)||!(a>0))){err.textContent="Every step needs a buy price and amount above 0.";return}
    if(!(roi>0&&roi<1000)){err.textContent="Enter a sell target percentage, e.g. 4.";return}
    steps.sort((a,b)=>b[0]-a[0]);
    const old=PLAN[sym].steps;
    fills[sym]=steps.map(([p])=>{const j=old.findIndex(o=>o[0]===p);return j>=0?!!fills[sym][j]:false});
    PLAN[sym].steps=steps; ROI=roi/100; delete editing[sym];
    const all={};for(const s in PLAN)all[s]=PLAN[s].steps;
    save("dca_steps",all); save("dca_roi",ROI); save("dca_fills",fills);
    alerted[sym]=""; save("dca_alerted",alerted);
    log(`${sym} ladder saved: ${steps.length} steps, sell target +${roi}%`);
    checkAlerts();
  }
  render();
});
const nowRow=px=>`<tr class="mk"><td colspan="9"><div class="now">NOW ${usd(px)}</div></td></tr>`;

document.addEventListener("change",e=>{
  const t=e.target; if(t.type!=="checkbox"||!t.dataset.s) return;
  fills[t.dataset.s][+t.dataset.i]=t.checked; save("dca_fills",fills); render(); checkAlerts();
});

/* ===== Prices ===== */
let bybitWarned=false;
async function fetchBybit(){
  const hosts=["https://api.bybit.com","https://api.bytick.com"];
  for(const h of hosts){
    try{
      const res=await Promise.all(Object.keys(PLAN).map(s=>
        getJSON(`${h}/v5/market/tickers?category=linear&symbol=${PLAN[s].binance}`)));
      const out={};
      Object.keys(PLAN).forEach((s,i)=>{const t=res[i]?.result?.list?.[0]; if(t) out[s]=+(priceType==="mark"?t.markPrice:t.lastPrice)});
      if(Object.keys(out).length===Object.keys(PLAN).length){Object.assign(prices,out);return `Bybit perpetual (${priceType==="mark"?"mark":"last"} price)`}
    }catch(e){}
  }
  throw new Error("bybit");
}
async function fetchPrices(){
  if(source==="bybit"){
    try{const r=await fetchBybit();bybitWarned=false;return r}
    catch(e){if(!bybitWarned){log("Bybit unreachable from this browser, using spot price instead");bybitWarned=true}}
  }
  try{
    const ids=Object.values(PLAN).map(p=>p.gecko).join(",");
    const d=await getJSON(`https://api.coingecko.com/api/v3/simple/price?vs_currencies=usd&ids=${ids}`);
    for(const s in PLAN) prices[s]=d[PLAN[s].gecko].usd;
    return "CoinGecko";
  }catch(e){
    const syms=JSON.stringify(Object.values(PLAN).map(p=>p.binance));
    const d=await getJSON(`https://api.binance.com/api/v3/ticker/price?symbols=${encodeURIComponent(syms)}`);
    for(const s in PLAN){const m=d.find(x=>x.symbol===PLAN[s].binance); if(m) prices[s]=+m.price}
    return "Binance";
  }
}
async function tick(){
  try{
    const src=await fetchPrices(); lastUpdate=new Date();
    document.getElementById("status").textContent=`Updated ${lastUpdate.toLocaleTimeString()} · ${src}`;
    if(!Object.keys(editing).length) render();
    checkAlerts();
  }catch(e){document.getElementById("status").textContent="Couldn't reach price servers, retrying…"}
}

/* ===== Alerts ===== */
function checkAlerts(){
  // re-read, so background checks in the app and this page share the same "already alerted" list
  alerted=load("dca_alerted",alerted); nearAlerted=load("dca_near",nearAlerted);
  for(const sym in PLAN){
    const c=calc(sym); if(!c.px) continue;
    let key=null,msg=null;
    if(c.target&&c.px>=c.target){
      key="sell-"+Math.round(c.target);
      msg=`🎯 ${sym} at ${usd(c.px)} hit your sell target ${usd(c.target)} (avg ${usd(c.avg)}, profit ≈ ${usd(c.pl,2)})`;
    }else if(c.next&&c.px<=c.next.price){
      key="buy-"+(c.next.i+1);
      msg=`🟢 ${sym} at ${usd(c.px)} reached buy step ${c.next.i+1}: ${usd(c.next.price)} for ${usd(c.next.amt)}. Tick it when filled.`;
    }
    if(key&&alerted[sym]!==key){alerted[sym]=key;save("dca_alerted",alerted);fire(msg)}
    if(key||!(nearPct>0)) continue;
    // "Getting close" warnings
    const near=nearPct/100;
    if(c.next&&c.px>c.next.price&&c.px<=c.next.price*(1+near)){
      const k="nearbuy-"+(c.next.i+1)+"-"+nearPct;
      if(nearAlerted[sym+"b"]!==k){nearAlerted[sym+"b"]=k;save("dca_near",nearAlerted);
        fire(`⚠️ ${sym} at ${usd(c.px)} is ${((c.px/c.next.price-1)*100).toFixed(2)}% above buy step ${c.next.i+1} (${usd(c.next.price)}, ${usd(c.next.amt)})`)}
    }
    if(c.target&&c.px<c.target&&c.px>=c.target*(1-near)){
      const k="nearsell-"+Math.round(c.target)+"-"+nearPct;
      if(nearAlerted[sym+"s"]!==k){nearAlerted[sym+"s"]=k;save("dca_near",nearAlerted);
        fire(`⚠️ ${sym} at ${usd(c.px)} is ${((1-c.px/c.target)*100).toFixed(2)}% below your sell target ${usd(c.target)} (+${usd(c.inv*ROI,2)} profit)`)}
    }
  }
}
function fire(msg){
  log(msg);
  const b=document.getElementById("banner"); b.textContent=msg; b.style.display="block";
  beep(); flashTitle(msg);
  try{
    if(APP) APP.notify("DCA alert",msg);
    else if(window.Notification&&Notification.permission==="granted") new Notification("DCA alert",{body:msg});
  }catch{}
  if(tg.token&&tg.chat){
    postJSON(`https://api.telegram.org/bot${tg.token}/sendMessage`,{chat_id:tg.chat,text:msg})
      .then(j=>log(j.ok?"Sent to Telegram":"Telegram error: "+j.description))
      .catch(()=>log("Telegram: couldn't send"));
  }
}
function log(m){const l=document.getElementById("log");l.textContent=`[${new Date().toLocaleString()}] ${m}\n`+l.textContent}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,0.25,0.5].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime+t);o.start(a.currentTime+t);o.stop(a.currentTime+t+.15)})}catch{}}
let flashT=null;function flashTitle(m){clearInterval(flashT);let on=false;flashT=setInterval(()=>{document.title=(on=!on)?"🔔 DCA ALERT":"DCA Ladder Tracker"},1000);
  window.addEventListener("focus",()=>{clearInterval(flashT);document.title="DCA Ladder Tracker"},{once:true})}

/* ===== Settings ===== */
const ns=document.getElementById("notifState");
function showNotif(){
  if(APP){ns.textContent=APP.notifStatus()==="granted"?"Phone notifications on · background checks about every 15 min":"Phone notifications are off: tap the button to allow them";return}
  ns.textContent=!window.Notification?"Notifications not supported in this browser":
  Notification.permission==="granted"?"Desktop notifications on":Notification.permission==="denied"?"Notifications blocked: allow them in the browser's site settings":""}
if(APP) document.getElementById("notif").textContent="Phone notification settings";
document.getElementById("notif").onclick=async()=>{if(APP){APP.requestNotif();return}try{await Notification.requestPermission()}catch{} showNotif()};
// Called by the app when it comes back to the screen
window.onAppResume=()=>{showNotif();tick()};
document.getElementById("test").onclick=()=>fire("✅ Test alert from your DCA tracker");
document.getElementById("tgToken").value=tg.token; document.getElementById("tgChat").value=tg.chat;
document.getElementById("tgSave").onclick=()=>{tg={token:document.getElementById("tgToken").value.trim(),chat:document.getElementById("tgChat").value.trim()};save("dca_tg",tg);log(tg.token&&tg.chat?"Telegram saved":"Telegram cleared")};
showNotif();
const srcEl=document.getElementById("src"), ptEl=document.getElementById("ptype");
srcEl.value=source; ptEl.value=priceType; ptEl.hidden=source!=="bybit";
srcEl.onchange=()=>{source=srcEl.value;save("dca_source",source);ptEl.hidden=source!=="bybit";tick()};
ptEl.onchange=()=>{priceType=ptEl.value;save("dca_pricetype",priceType);tick()};
document.getElementById("nearPct").value=nearPct;
document.getElementById("nearSave").onclick=()=>{
  const v=parseFloat(document.getElementById("nearPct").value);
  if(!(v>=0&&v<=50)){log("Enter a warning distance between 0 and 50%");return}
  nearPct=v; save("dca_nearpct",v); log(v?`Near-level warnings at ${v}%`:"Near-level warnings off"); checkAlerts();
};

if(APP) document.getElementById("subline").textContent="Live prices every 30 seconds while open · alerts keep running in the background";
render(); tick(); setInterval(tick,REFRESH_MS);
</script>
